version: "3.9"

services:
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "4600:8000"
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3600:3000"
    env_file: ./frontend/.env.local
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fizi
      POSTGRES_PASSWORD: fizi_pass
      POSTGRES_DB: fizi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5490:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fizi -d fizi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
